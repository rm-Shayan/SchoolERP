# School ERP — Local Development
#
# Architecture:
#
#                    Nginx
#                      │
#                      ↓
#                  Backend
#                 /       \
#                ↓         ↓
#             Redis     PostgreSQL
#
# NOTE:
# This Compose file is for LOCAL DEVELOPMENT.
# Production will use Kubernetes manifests.
#
# Start:
#   docker compose up --build -d
#
# Stop:
#   docker compose down
#
# Logs:
#   docker compose logs -f backend
#   docker compose logs -f redis
#   docker compose logs -f postgres
#   docker compose logs -f nginx

services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_erp}
      POSTGRES_USER: ${POSTGRES_USER:-school_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolpostgres2026}

    volumes:
      - school-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-school_admin} -d ${POSTGRES_DB:-school_erp}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - school-net

    # PostgreSQL is NOT exposed to host/internet.
    # Backend accesses:
    # postgres:5432


  # ============================================================
  # Redis
  # ============================================================

  redis:
    build: ./Backend/docker/redis
    image: school-redis:latest

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-schoolredis2026}

    volumes:
      - school-redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-schoolredis2026}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - school-net

    # Redis is NOT exposed.
    # Backend accesses:
    # redis:6379


  # ============================================================
  # Backend
  # ============================================================

  backend:
    build: ./Backend
    image: school-backend:latest

    restart: unless-stopped

    env_file:
      - ./Backend/.env

    environment:
      NODE_ENV: development
      PORT: "3000"

      # PostgreSQL
      DATABASE_URL: "postgresql://${POSTGRES_USER:-school_admin}:${POSTGRES_PASSWORD:-schoolpostgres2026}@postgres:5432/${POSTGRES_DB:-school_erp}"

      # Redis
      REDIS_URL: "redis://:${REDIS_PASSWORD:-schoolredis2026}@redis:6379"

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - ./Backend/logs:/app/logs
      - ./Backend/uploads:/app/uploads

    expose:
      - "3000"

    networks:
      - school-net


  # ============================================================
  # Nginx
  # ============================================================

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - school-net


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:

  school-postgres-data:
    name: school-postgres-data

  school-redis-data:
    name: school-redis-data


# ==============================================================
# Private Docker Network
# ==============================================================

networks:

  school-net:
    driver: bridge
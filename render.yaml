# ─── Render Blueprint ─────────────────────────────────────────────────
# Deploy: Push this file to your repo, then in Render Dashboard
#         click "New" → "Blueprint" and select your repo.
#
# PostgreSQL: Render managed (free tier — 90 days, then ₹0 for basic)
# Redis:      Use Upstash Redis (free tier) — set REDIS_URL manually
# ─────────────────────────────────────────────────────────────────────


services:

  # ── Backend API ──
  - type: web
    name: school-erp-backend
    runtime: image
    image:
      url: ""  # built from Dockerfile in repo root
    dockerfilePath: Backend/Dockerfile
    dockerContext: Backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString
      - key: REDIS_URL
        sync: false  # set manually from Upstash dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://your-frontend.onrender.com"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:

  # ── PostgreSQL ──
  - name: school-erp-db
    plan: free
    databaseName: school_erp
    ipAllowList: []  # only internal access (Render → Render)
